            --border-color: #e2e8f0; --primary: #5C2D91; --primary-hover: #4a2375; --shadow: 0 4px 15px rgba(0,0,0,0.05);
            --success: #38a169; --danger: #e53e3e; --warning: #d69e2e;
            --brand-text: #5C2D91;
        }
        [data-theme="dark"] {
            --bg-body: #1a202c; --bg-card: #2d3748; --text-main: #f7fafc; --text-muted: #a0aec0;
            --border-color: #4a5568; --primary: #805AD5; --primary-hover: #6B46C1; --shadow: 0 4px 15px rgba(0,0,0,0.3);
            --brand-text: #D1C4E9;

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; transition: background 0.3s, color 0.3s; }
        
        /* Header */
        header { background-color: var(--bg-card); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); border-bottom: 2px solid var(--border-color); flex-wrap: wrap; gap: 15px; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; border: 2px solid var(--primary); }
        .logo-text strong { font-size: 22px; font-weight: 800; color: var(--brand-text); display: block; line-height: 1.2; }
        /* Slogan Font Size Increased */
        .logo-text .slogan { font-size: 14px; color: var(--warning); font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; display: block; margin-top: 2px;}
        .beta-badge { background: var(--warning); color: #1a1a2e; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; margin-left: 5px; vertical-align: middle; }
        
        nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        nav button { background: none; border: none; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: 0.2s; padding: 8px 12px; border-radius: 8px;}
        nav button:hover, nav button.active { color: var(--primary); background: rgba(92, 45, 145, 0.1); }
        
        .header-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .notification-bell { position: relative; cursor: pointer; font-size: 20px; }
        .notification-dot { position: absolute; top: 0; right: 0; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; }
        
        /* Google Translate Widget Styling */
        #google_translate_element { border: 2px solid var(--primary); border-radius: 8px; padding: 2px 5px; background: var(--bg-card); font-weight: bold; }
        .goog-te-gadget-simple { border: none !important; background-color: transparent !important; }
        .goog-te-gadget-simple .goog-te-menu-value span { color: var(--primary) !important; font-family: inherit !important; }

        .theme-toggle { position: relative; }
        .theme-btn { background: var(--bg-body); border: 1px solid var(--border-color); font-size: 18px; cursor: pointer; padding: 6px 10px; border-radius: 8px; color: var(--text-main); }
        .theme-menu { display: none; position: absolute; top: 100%; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: var(--shadow); z-index: 200; min-width: 120px; margin-top: 5px; }
        .theme-menu button { display: block; width: 100%; text-align: left; padding: 10px 15px; background: none; border: none; font-family: inherit; color: var(--text-main); cursor: pointer; font-size: 13px; }
        .theme-menu button:hover { background: var(--bg-body); }
        .theme-toggle:hover .theme-menu { display: block; }

        /* Tabs & Layout */
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* Hero Section */
        .hero { background: linear-gradient(135deg, var(--primary) 0%, #1a1a2e 100%); color: white; padding: 40px 20px; border-radius: 20px; text-align: center; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(92, 45, 145, 0.3); }
        .hero h1 { font-size: 28px; margin-bottom: 10px; }
        .hero p { font-size: 15px; opacity: 0.9; margin-bottom: 20px; }
        .dao-tags { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .dao-tags span { background: rgba(255,255,255,0.15); padding: 6px 15px; border-radius: 30px; font-size: 13px; font-weight: 600; }

        /* Category Grid */
        .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .cat-item { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 10px; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: var(--shadow); }
        .cat-item:hover { transform: translateY(-3px); border-color: var(--primary); }
        .cat-icon { font-size: 24px; margin-bottom: 5px; display: block; }
        .cat-name { font-size: 11px; font-weight: 700; color: var(--text-main); }

        /* Search & Filters */
        .search-section { background: var(--bg-card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap; border: 1px solid var(--border-color); align-items: center;}
        .search-bar { flex: 1; min-width: 200px; }
        .search-bar input, .filter-dropdown { width: 100%; padding: 12px 20px; border: 2px solid var(--border-color); border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; background: var(--bg-card); color: var(--text-main); }
        .search-bar input:focus, .filter-dropdown:focus { border-color: var(--primary); }
        .filter-dropdown { min-width: 120px; cursor: pointer; font-weight: 600; }
        .btn-search { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-adv { background: transparent; color: var(--primary); border: 2px solid var(--primary); padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        
        /* Toggle Switch */
        .toggle-switch { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; color: var(--text-main); }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* Provider Cards */
        .provider-card { background: var(--bg-card); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid var(--border-color); transition: 0.3s; display: flex; gap: 15px; align-items: flex-start; }
        .provider-card:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); border-color: var(--primary); }
        .provider-card.featured { border: 2px solid var(--warning); background: linear-gradient(to right, rgba(214, 158, 46, 0.05), transparent); }
        .provider-img { width: 70px; height: 70px; border-radius: 12px; background: #e2e8f0; object-fit: cover; flex-shrink: 0; }
        .provider-info { flex: 1; }
        .provider-name { font-size: 18px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .featured-tag { font-size: 10px; background: var(--warning); color: #000; padding: 2px 8px; border-radius: 4px; font-weight: 700; }
        .provider-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); margin: 6px 0; flex-wrap: wrap; align-items: center;}
        
        /* Fractional Stars */
        .star-rating-display { display: inline-flex; align-items: center; font-size: 15px; color: #ffd700; position: relative; letter-spacing: 2px;}
        .star-rating-display .stars-bg { color: #e2e8f0; }
        .star-rating-display .stars-fill { position: absolute; top: 0; left: 0; white-space: nowrap; overflow: hidden; }
        [data-theme="dark"] .star-rating-display .stars-bg { color: #4a5568; }
        
        .provider-desc { color: var(--text-muted); font-size: 13px; margin: 8px 0; }
        .meta-tag { background: var(--bg-body); padding: 3px 8px; border-radius: 5px; font-size: 11px; color: var(--text-muted); }
        
        .action-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn { background-color: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; font-family: inherit; text-decoration: none; display: inline-block; text-align: center;}
        .btn:hover { background-color: var(--primary-hover); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* Forms */
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 700; color: var(--text-main); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 10px; font-family: inherit; outline: none; background: var(--bg-card); color: var(--text-main); }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
        
        /* Phone Field Fix */
        .phone-input-group { display: flex; gap: 10px; width: 100%; }
        .phone-input-group #phoneCode { width: 80px; padding: 12px; text-align: center; flex-shrink: 0; }
        .phone-input-group #regMobile { flex: 1; width: auto; }

        /* Tooltips (Info Icons) */
        .info-icon { display: inline-flex; justify-content: center; align-items: center; width: 20px; height: 20px; background: var(--primary); color: white; border-radius: 50%; font-size: 12px; cursor: pointer; font-weight: bold; }
        .info-icon:hover::after { content: attr(data-tooltip); position: absolute; bottom: 100%; left: 0; background: #333; color: white; padding: 6px 10px; border-radius: 6px; font-size: 11px; white-space: pre-wrap; z-index: 10; margin-bottom: 8px; width: max-content; max-width: 200px; font-weight: normal;}

        /* Upload Box */
        .upload-box { border: 2px dashed var(--border-color); padding: 20px; text-align: center; border-radius: 10px; color: var(--text-muted); cursor: pointer; background: var(--bg-body); position: relative; overflow: hidden; }
        .upload-box:hover { border-color: var(--primary); color: var(--primary); }
        .upload-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; background: var(--bg-body); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .checkbox-group input { margin-top: 4px; width: 18px; height: 18px; }
        .checkbox-group label { font-size: 13px; color: var(--text-muted); line-height: 1.5; cursor: pointer; }

        /* Help & Admin */
        .help-box { background: var(--bg-card); padding: 25px; border-radius: 16px; margin-bottom: 20px; box-shadow: var(--shadow); border-left: 5px solid var(--primary); }
        .help-box h3 { color: var(--primary); margin-bottom: 10px; }
        .help-tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 2px solid var(--border-color); }
        .help-tab-btn { background: none; border: none; padding: 12px 20px; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
        .help-tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .help-tab-content { display: none; animation: fadeIn 0.3s ease; }
        .help-tab-content.active { display: block; }
        
        .admin-table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
        .admin-table th, .admin-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px;}
        .admin-table th { background: var(--bg-body); font-weight: 800; color: var(--text-main); }
        
        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--bg-card); width: 90%; max-width: 600px; border-radius: 20px; padding: 30px; position: relative; max-height: 90vh; overflow-y: auto; color: var(--text-main); box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .close-btn { position: absolute; top: 15px; right: 15px; background: var(--bg-body); border: none; font-size: 20px; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; color: var(--text-main); display: flex; align-items: center; justify-content: center; }
        .close-btn:hover { background: var(--danger); color: white; }

        /* Reviews & Survey */
        .review-item { background: var(--bg-body); padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary); }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; }
        .reviewer-name { font-weight: 700; font-size: 14px; color: var(--text-main); }
        .review-text { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
        
        .quick-survey { background: var(--bg-body); padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px solid var(--border-color); }
        .survey-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border-color); }
        .survey-options { display: flex; gap: 5px; }
        .survey-opt { background: var(--bg-card); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .survey-opt.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Chatbot */
        .chatbot-btn { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; transition: 0.3s; }
        .chatbot-btn:hover { transform: scale(1.1); }
        .chatbot-window { display: none; position: fixed; bottom: 90px; right: 5%; width: 90%; max-width: 350px; background: var(--bg-card); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000; border: 1px solid var(--border-color); overflow: hidden; flex-direction: column; }
        .chatbot-header { background: var(--primary); color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .chatbot-messages { padding: 15px; height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { background: var(--bg-body); padding: 10px; border-radius: 10px; font-size: 14px; max-width: 85%; }
        .chat-msg.user { background: rgba(92, 45, 145, 0.1); align-self: flex-end; border-right: 3px solid var(--primary); }
        .chat-msg.bot { align-self: flex-start; border-left: 3px solid var(--success); }
        .chatbot-input { display: flex; padding: 10px; border-top: 1px solid var(--border-color); }
        .chatbot-input input { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 20px; outline: none; font-family: inherit; background: var(--bg-body); color: var(--text-main); }
        .chatbot-input button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 20px; margin-left: 10px; cursor: pointer; font-weight: bold; }
        .quick-replies { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
        .quick-reply { background: var(--bg-card); border: 1px solid var(--primary); color: var(--primary); padding: 6px 10px; border-radius: 15px; font-size: 12px; cursor: pointer; font-family: inherit; }
        .quick-reply:hover { background: var(--primary); color: white; }
    </style>
</head>

            appData.countries.filter(c => c.region === region).forEach(c => {
                select.innerHTML += `<option value="${c.name}">${c.name}</option>`;
            });
            document.getElementById('regCity').innerHTML = '<option value="">Select City...</option>';
        }

        function populateFilterCountries(region) {
            const select = document.getElementById('filterCountry');
            select.innerHTML = '<option value="All">All Countries</option>';
            const filtered = region === 'All' ? appData.countries : appData.countries.filter(c => c.region === region);
            filtered.forEach(c => {
                select.innerHTML += `<option value="${c.name}">${c.name}</option>`;
            });
            document.getElementById('filterCity').innerHTML = '<option value="All">All Cities</option>';
        }

        function populateRegCities(countryName) {
            const country = appData.countries.find(c => c.name === countryName);
            const select = document.getElementById('regCity');
            select.innerHTML = '<option value="">Select City...</option>';
            if(country && country.cities) {
                country.cities.forEach(city => {
                    select.innerHTML += `<option value="${city}">${city}</option>`;
                });
            }
        }

        function populateFilterCities(countryName) {
            const country = appData.countries.find(c => c.name === countryName);
            const select = document.getElementById('filterCity');
            select.innerHTML = '<option value="All">All Cities</option>';
            if(country && country.cities) {
                country.cities.forEach(city => {
                    select.innerHTML += `<option value="${city}">${city}</option>`;
                });
            }
        }

        function updatePhoneCode(countryName) {
            const country = appData.countries.find(c => c.name === countryName);
            document.getElementById('phoneCode').value = country ? country.phone : '';
        }

        // --- Custom Category Logic Fix ---
        function handleCategoryChange() {
            const mainCat = document.getElementById('regMainCategory').value;
            const subCatGroup = document.getElementById('subCatGroup');
            const subCatSelect = document.getElementById('regSubCategory');
            const customCatGroup = document.getElementById('customCatGroup');

            if (mainCat === 'Others') {
                subCatGroup.style.display = 'none';
                customCatGroup.style.display = 'block';
            } else if (mainCat && appData.categories[mainCat]) {
                customCatGroup.style.display = 'none';
                subCatGroup.style.display = 'block';
                subCatSelect.innerHTML = '<option value="">Select...</option>';
                appData.categories[mainCat].forEach(sub => {
                    subCatSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            } else {
                subCatGroup.style.display = 'none';
                customCatGroup.style.display = 'none';
            }
        }

        function updateSubCategories() {
            const mainCat = document.getElementById('filterCategory').value;
            const subCatSelect = document.getElementById('filterSubCategory');
            subCatSelect.innerHTML = '<option value="All">All Subcategories</option>';
            if (mainCat !== 'All' && appData.categories[mainCat]) {
                appData.categories[mainCat].forEach(sub => {
                    subCatSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            }
        }

        function previewImage(input, previewId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById(previewId);
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function togglePaymentButton() {
            const checkbox = document.getElementById('termsCheckbox');
            const btn = document.getElementById('payBtn');
            btn.disabled = !checkbox.checked;
            btn.style.opacity = checkbox.checked ? '1' : '0.5';
            btn.style.cursor = checkbox.checked ? 'pointer' : 'not-allowed';
        }

        function saveProviderData() {
            alert("Registration Data Saved! Triggering Pi Payment...");
            localStorage.setItem('isProvider', 'true');
            updateMerchantConsole();
            switchTab('merchant', null);
        }

        // --- 4. Rendering ---
        function generateStars(rating) {
            const percentage = (rating / 5) * 100;
            return `<div class="star-rating-display"><span class="stars-bg">★★★★★</span><span class="stars-fill" style="width: ${percentage}%;">★★★★★</span></div>`;
        }

        function renderProviders(containerId, providers) {
            const container = document.getElementById(containerId);
            if(!container) return;
            if(providers.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); padding: 10px;">No providers found.</p>';
                return;
            }
            let html = '';
            providers.forEach(p => {
                html += `
                    <div class="provider-card ${p.featured ? 'featured' : ''}">
                        <img src="https://via.placeholder.com/70/5C2D91/FFFFFF?text=${p.name.charAt(0)}" class="provider-img">
                        <div class="provider-info">
                            <div class="provider-name">${p.name} ✅ ${p.featured ? '<span class="featured-tag">FEATURED</span>' : ''}</div>
                            <div class="provider-meta">
                                ${generateStars(p.rating)} <span>${p.rating} (${p.reviews})</span> • <span>${p.cat}</span>
                            </div>
                            <div class="provider-desc">${p.desc}</div>
                            <div class="provider-meta"><span class="meta-tag">📍 ${p.city}, ${p.country}</span></div>
                            <div class="action-row"><button class="btn btn-sm" onclick="openModal(${p.id})">View Details</button></div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function loadMockProviders() {
            renderProviders('homeFeaturedList', mockProviders.filter(p => p.featured));
            renderProviders('homeTopRatedList', mockProviders.slice().sort((a,b) => b.rating - a.rating));
            renderProviders('homeNewList', mockProviders.slice().reverse());
            renderProviders('servicesProviderList', mockProviders);
        }

        function filterProviders(source) {
            if(source === 'home') {
                const text = document.getElementById('homeSearchInput').value.toLowerCase();
                const filtered = mockProviders.filter(p => p.name.toLowerCase().includes(text));
                renderProviders('homeTopRatedList', filtered.sort((a,b) => b.rating - a.rating));
                return;
            }
            const text = document.getElementById('serviceSearchInput').value.toLowerCase();
            const cat = document.getElementById('filterCategory').value;
            const country = document.getElementById('filterCountry').value;
            const city = document.getElementById('filterCity').value;
            
            let filtered = mockProviders.filter(p => {
                return p.name.toLowerCase().includes(text) &&
                       (cat === 'All' || p.cat === cat) &&
                       (country === 'All' || p.country === country) &&
                       (city === 'All' || p.city === city);
            });
            renderProviders('servicesProviderList', filtered);
        }

        function selectCategoryAndSearch(cat) {
            switchTab('services', null);
            document.getElementById('filterCategory').value = cat;
            updateSubCategories();
            filterProviders('services');
        }

        function toggleLocation() {
            const isLocal = document.getElementById('homeGlobalToggle').checked;
            if(isLocal) {
                if(navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => alert(`Location access granted. Showing local results.`),
                        () => { alert("Location access denied. Showing global results."); document.getElementById('homeGlobalToggle').checked = false; }
                    );
                }
            }
        }

        // --- 5. Modal & Reviews ---
        let currentRating = 0;
        let surveyData = {};

        function openModal(id) {
            const p = mockProviders.find(x => x.id === id);
            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modalRating').innerHTML = `${generateStars(p.rating)} <span style="color:var(--text-muted); font-size:14px;">${p.rating} (${p.reviews} reviews)</span>`;
            document.getElementById('modalDetails').innerHTML = `<p>${p.desc}</p><p style="margin-top: 8px;">📍 ${p.city}, ${p.country}</p>`;
            
            document.getElementById('modalReviewsList').innerHTML = `
                <div class="review-item"><div class="review-header"><span class="reviewer-name">Ali (Tier 3)</span>${generateStars(5)}</div><p class="review-text">Excellent service! 😊</p></div>
                <div class="review-item"><div class="review-header"><span class="reviewer-name">Sara (Tier 2)</span>${generateStars(4)}</div><p class="review-text">Good quality, but delivery took a bit long.</p></div>
            `;
            document.getElementById('providerModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('providerModal').style.display = 'none'; }

        function setRating(rating) {
            currentRating = rating;
            document.querySelectorAll('#starRating span').forEach((star, index) => {
                star.style.color = index < rating ? '#ffd700' : 'var(--border-color)';
            });
        }

        function selectSurvey(el, category, value) {
            el.parentElement.querySelectorAll('.survey-opt').forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
            surveyData[category] = value;
        }

        function submitReview() {
            if(!document.getElementById('reviewRulesCheck').checked) return alert("Please agree to the rules.");
            if(currentRating === 0) return alert("Please select a star rating.");
            const text = document.getElementById('reviewText').value;
            if(text.length < 10) return alert("Review must be at least 10 characters.");
            if(text.includes("http") || text.includes("www.")) return alert("Links are not allowed.");
            
            alert("Review and Quick Survey submitted successfully!");
            document.getElementById('reviewText').value = '';
            setRating(0);
            document.getElementById('reviewRulesCheck').checked = false;
            closeModal();
        }

        // --- 6. Merchant & Admin ---
        function updateMerchantConsole() {
            const content = document.getElementById('merchantContent');
            if(localStorage.getItem('isProvider') === 'true') {
                content.innerHTML = `
                    <div style="background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color);">
                        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px;">
                            <div><h3>My Business</h3><span style="color:var(--success); font-size:12px;">✅ Verified</span></div>
                            <div style="text-align:right;">${generateStars(4.8)}<div style="font-size:12px; color:var(--text-muted);">4.8 (12 reviews)</div></div>
                        </div>
                        <h4>Recent Reviews</h4>
                        <div class="review-item" style="margin-top: 10px;">
                            <div class="review-header"><span class="reviewer-name">User123</span> ${generateStars(4)}</div>
                            <p class="review-text">Great service!</p>
                            <button class="btn btn-sm" style="margin-top:5px; background:var(--success);" onclick="alert('Reply sent.')">Reply</button>
                        </div>
                        <h4 style="margin-top: 20px;">Subscription Plan: Basic</h4>
                        <button class="btn" style="margin-top: 10px; background: var(--warning);">Upgrade to Pro (15 Pi)</button>
                        <button class="btn" style="margin-top: 10px; background: #ffd700; color: #000;">Upgrade to Featured (25 Pi)</button>
                        <div style="margin-top: 30px; border-top: 1px dashed var(--border-color); padding-top: 15px;">
                            <button class="btn" style="background: var(--bg-body); color: var(--text-main); border: 1px solid var(--border-color);" onclick="alert('This feature will be fully functional on Mainnet to invite managers by Pi UID.')">Invite Manager (Mainnet Feature)</button>
                        </div>
                    </div>
                `;
            } else {
                content.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 50px;">Please Login and Register a business to view your console.</p>`;
            }
        }

        function accessAdminPanel() {
            const uid = prompt("Enter Admin UID to access panel:");
            if(uid === "Hadi0011" || uid === "admin") {
                switchTab('admin', null);
                alert("Access Granted. Welcome Admin.");
            } else {
                alert("Access Denied.");
            }
        }

        function switchAdminTab(tab, e) {
            document.querySelectorAll('#tab-admin .help-tab-btn').forEach(b => b.classList.remove('active'));
            if(e) e.target.classList.add('active');
            const content = document.getElementById('adminContent');
            if(tab === 'pending') {
                content.innerHTML = `<table class="admin-table"><tr><th>Name</th><th>Status</th><th>Action</th></tr><tr><td>New Clinic</td><td style="color:var(--warning)">Pending</td><td><button class="btn btn-sm" style="background:var(--success)">Approve</button></td></tr></table>`;
            } else if (tab === 'reports') {
                content.innerHTML = `<p>No reported reviews at this time.</p>`;
            } else if (tab === 'finance') {
                content.innerHTML = `<p>Total Revenue: 150 Pi</p><p>Pending Payouts: 20 Pi</p>`;
            } else if (tab === 'chat') {
                content.innerHTML = `<p><strong>Chat with Provider:</strong> "Hello Admin, I need help with my subscription."</p><textarea style="width:100%; height: 60px; margin-top:10px;" placeholder="Type reply..."></textarea><button class="btn btn-sm" style="margin-top:5px; background:var(--primary);">Reply to Provider</button>`;
            }
        }

        // --- 7. Chatbot ---
        function toggleChat(sender) {
            const w = document.getElementById('chatbotWindow');
            const headerTitle = document.getElementById('chatHeaderTitle');
            
            if(sender === 'merchant') headerTitle.innerText = "Chat with: Admin Support";
            else if(sender === 'admin') headerTitle.innerText = "Chat with: Provider Store";
            else headerTitle.innerText = "Hi Pi Assistant";

            w.style.display = w.style.display === 'flex' ? 'none' : 'flex';
        }

        function quickAsk(text) { document.getElementById('chatInput').value = text; sendChatMessage(); }
        function handleChatEnter(e) { if (e.key === 'Enter') sendChatMessage(); }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const messages = document.getElementById('chatMessages');
            messages.innerHTML += `<div class="chat-msg user">${text}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            setTimeout(() => {
                let reply = "I'm not sure. Please check the Help tab or contact @MainHadi0011.";
                const t = text.toLowerCase();

                if (t.includes('what') && t.includes('app')) reply = "Hi Pi is a decentralized review platform. We help you find trusted services in the Pi ecosystem.";
                if (t.includes('register')) reply = "Go to the 'Register' tab, fill in your details, and pay the 5 Pi registration fee.";
                if (t.includes('vote') || t.includes('review')) reply = "Open any provider, click 'View Details', select your stars, and submit your review.";
                if (t.includes('fee') || t.includes('cost')) reply = "Registration is 5 Pi. Featured is 25 Pi/mo, and Pro is 15 Pi/mo.";
                if (t.includes('tier')) reply = "Tiers (1 to 4) are based on your Pi transactions. Higher Tiers have stronger vote weights.";
                if (t.includes('report') || t.includes('abuse')) reply = "Tap the 🚩 Report button next to any review. Admin will investigate.";
                if (t.includes('disagree') || t.includes('fake')) reply = "Providers can reply directly. If it's fake, request mediation from your console. Admin's decision is final.";
                if (t.includes('reject') || t.includes('spam')) reply = "Reviews must be real, at least 10 chars, and contain no links.";
                if (t.includes('survey')) reply = "It's 4 short questions after you review. It helps us verify fake reviews.";
                if (t.includes('❓') || t.includes('icon')) reply = "Tap the ❓ icon next to any confusing field to see a quick explanation.";

                messages.innerHTML += `<div class="chat-msg bot">${reply}</div>`;
                messages.scrollTop = messages.scrollHeight;
            }, 600);
        }

        // --- 8. Pi SDK ---
        if (window.Pi) { Pi.init({ version: "2.0" }); }

        async function loginWithPi() {
            if (window.Pi) {
                try {
                    Pi.init({ version: "2.0" });
                    const auth = await Pi.authenticate(['username'], onIncompletePaymentFound);
                    
                    const response = await fetch("https://backend.appstudio-u7cm9zhmha0ruwv8.piappengine.com/pi/auth/v1/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ accessToken: auth.accessToken })
                    });
                    
                    const data = await response.json();
                    if (data.sessionToken) {
                        alert("Login Successful! Welcome, " + data.user.username);
                        window.sessionToken = data.sessionToken;
                        localStorage.setItem('piUsername', data.user.username);
                        document.getElementById('notifDot').style.display = 'block';
                    } else {
                        alert("Login failed: Invalid token.");
                    }
                } catch (err) {
                    alert("Error: " + err.message);
                }
            } else {
                alert("Please open this app in Pi Browser.");
            }
        }

        function onIncompletePaymentFound(payment) { console.log("Incomplete payment found", payment); }
    </script>
</body>
</html>
